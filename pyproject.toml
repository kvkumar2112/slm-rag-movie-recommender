[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-rag-movie-recommender"
version = "0.2.0"
description = "Generative-retrieval movie recommender: an SLM writes a target profile, ChromaDB finds real movies that match it."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "openai>=1.40",
    "pydantic>=2.6",
    "pymongo>=4.6",
    "pandas>=2.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # PyTorch stopped shipping Intel-Mac wheels at 2.2.2; pin a stack that still works there.
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "transformers<4.50; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sentence-transformers<4; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
movie-rag = "movie_rag.cli:main"

[tool.setuptools.packages.find]
include = ["movie_rag*"]

[tool.setuptools.package-data]
movie_rag = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads the embedding model and builds a real ChromaDB collection"]
